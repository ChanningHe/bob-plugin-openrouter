name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches version
        run: |
          version=$(node -p "require('./src/info.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match src/info.json version $version" >&2
            exit 1
          fi

      - run: npm test

      - name: Pack
        id: pack
        run: echo "file=$(sh scripts/pack.sh | head -1)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" --verify-tag --generate-notes

      - name: Update appcast.json on main
        run: |
          git checkout -B main origin/main
          node scripts/appcast.js "${{ steps.pack.outputs.file }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.json
          git commit -m "chore: update appcast for $GITHUB_REF_NAME"
          git push origin main
